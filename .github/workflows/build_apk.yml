name: Xuat File APK Chua An Lac

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Tai code tu kho chua
        uses: actions/checkout@v4

      - name: 2. Cai dat Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Cai dat Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 4. Dong goi HTML thanh App Android (Chong loi YouTube 153)
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.chuaanlac.game",
            "appName": "Chùa An Lạc",
            "webDir": "www",
            "server": {
              "androidScheme": "http",
              "hostname": "localhost",
              "cleartext": true
            }
          }
          EOF
          npx cap add android
          npx cap sync

          # Bat quyen truy cap Internet cho App Android
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 5. Xuat file APK de tai ve
        uses: actions/upload-artifact@v4
        with:
          name: Chua_An_Lac_Android_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
