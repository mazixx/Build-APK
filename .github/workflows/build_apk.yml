name: Xuat File APK Chua An Lac

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Tai code tu kho chua
        uses: actions/checkout@v4

      - name: 2. Cai dat Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Cai dat Java JDK 21 (Chuan moi nhat cho Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: 4. Dong goi HTML thanh App Android
        run: |
          mkdir -p www
          # Tu dong tim file .html cua ban (du ban dat ten la index.html hay ten khac)
          HTML_FILE=$(find . -maxdepth 1 -iname "*.html" | head -n 1)
          if [ -n "$HTML_FILE" ]; then
            cp "$HTML_FILE" www/index.html
          else
            echo "<h1>Chua tim thay file index.html</h1>" > www/index.html
          fi

          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.chuaanlac.game",
            "appName": "Chua An Lac",
            "webDir": "www",
            "server": {
              "androidScheme": "http",
              "hostname": "localhost",
              "cleartext": true
            }
          }
          EOF

          npx cap add android
          npx cap sync android

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 5. Xuat file APK de tai ve
        uses: actions/upload-artifact@v4
        with:
          name: Chua_An_Lac_Android_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
